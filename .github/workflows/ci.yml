name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check scaffold availability
        id: scaffold
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "has_package=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_package=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found; scaffold has not been created yet."
          fi

      - name: Install dependencies
        if: steps.scaffold.outputs.has_package == 'true'
        run: npm ci

      - name: Audit dependencies
        if: steps.scaffold.outputs.has_package == 'true'
        run: npm audit --audit-level=high

      - name: Lint
        if: steps.scaffold.outputs.has_package == 'true'
        run: npm run lint

      - name: Type check
        if: steps.scaffold.outputs.has_package == 'true'
        run: npm run typecheck

      - name: Unit tests
        if: steps.scaffold.outputs.has_package == 'true'
        run: npm run test -- --run

      - name: Install Playwright browser
        if: steps.scaffold.outputs.has_package == 'true'
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        if: steps.scaffold.outputs.has_package == 'true'
        run: npm run test:e2e
